<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>You're offline — THE RESET</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100%; padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
      background: #fff; color: #111; text-align: center;
      font-family: Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .logo { color: #111; font-size: 22px; font-weight: 800; letter-spacing: .02em; margin: 0 0 48px; }
    .mark { width: 56px; height: 56px; margin: 0 auto 24px; border: 1.5px solid #111; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; letter-spacing: -.01em; }
    p { font-size: 15px; line-height: 1.6; color: #666; margin: 0 auto 28px; max-width: 320px; }
    button {
      min-width: 200px; height: 48px; padding: 0 28px; border: 0; border-radius: 0;
      background: #111; color: #fff; font: inherit; font-size: 13px; font-weight: 600;
      letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
    }
    button:active { background: #333; }
    .hint { margin-top: 18px; font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <p class="logo">THE RESET</p>
  <div class="mark" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8.8a15 15 0 0 1 20 0" /><path d="M5 12.5a10 10 0 0 1 14 0" /><path d="M8.5 16a5 5 0 0 1 7 0" /><path d="M12 19.5h.01" /><path d="M3 3l18 18" />
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>Check your Wi-Fi or mobile data. Your bag is saved on this phone — nothing is lost.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <p class="hint">We'll reload by ourselves once you're back online.</p>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
