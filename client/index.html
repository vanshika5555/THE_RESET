<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="Considered essentials for men and women. Clean lines, honest fabric, nothing excess."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      Brand font (Archivo, variable width + weight), loaded once for the whole site. They used to be @import-ed
      separately in eleven CSS files, which made phones wait on the same
      font file again and again before showing anything.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap"
    />

    <meta property="og:site_name" content="THE RESET" />
    <meta property="og:title" content="THE RESET — Considered Essentials" />
    <meta property="og:description" content="Considered essentials for men and women. Clean lines, honest fabric, nothing excess." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://the-reset-snowy.vercel.app/" />
    <meta property="og:image" content="https://the-reset-snowy.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="THE RESET — considered essentials for men and women" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://the-reset-snowy.vercel.app/og.jpg" />
    <meta name="robots" content="index, follow" />
    <title>THE RESET — Considered Essentials</title>
    <!-- Tells Google the shop's name, logo and how to search it (a search box can show under the result). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://the-reset-snowy.vercel.app/#org",
            "name": "THE RESET",
            "url": "https://the-reset-snowy.vercel.app/",
            "logo": "https://the-reset-snowy.vercel.app/logo512.png"
          },
          {
            "@type": "WebSite",
            "name": "THE RESET",
            "url": "https://the-reset-snowy.vercel.app/",
            "publisher": { "@id": "https://the-reset-snowy.vercel.app/#org" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://the-reset-snowy.vercel.app/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
