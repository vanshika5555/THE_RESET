# Runs on every push and pull request: the tests, plus a real production
# build of the shop and the admin. A red ✗ next to a commit on GitHub means
# something broke — before Vercel or Render serves it to anyone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      # Every route file must at least load — catches a wrong file copied in.
      - run: node -e "['auth','orders','products','returns','reviews','coupons','uploads','alerts','newsletter','share','sitemap','payments'].forEach(r=>require('./routes/'+r))"

  shop:
    name: Shop tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  admin:
    name: Admin tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
